name: Build llama.cpp

on:
  workflow_dispatch:
  push:
    branches:
      - ui/assistant-edit-fields
  pull_request:
    branches:
      - ui/assistant-edit-fields

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build llama.cpp
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             ninja-build             python3             python3-pip             python3-dev             python3-wheel             libssl-dev             libcurl4-openssl-dev

      - name: Configure
        run: |
          cmake -S . -B build             -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DGGML_NATIVE=OFF             -DLLAMA_BUILD_COMMON=ON             -DLLAMA_BUILD_TOOLS=ON             -DLLAMA_BUILD_EXAMPLES=ON             -DLLAMA_BUILD_TESTS=ON             -DLLAMA_BUILD_SERVER=ON             -DLLAMA_BUILD_APP=ON             -DLLAMA_BUILD_UI=ON             -DLLAMA_USE_PREBUILT_UI=ON             -DLLAMA_OPENSSL=ON

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run tests
        working-directory: build
        run: |
          ctest -L main --output-on-failure --timeout 900

      - name: Verify llama-server
        run: |
          ./build/bin/llama-server --help

      - name: Verify build artifacts
        run: |
          test -f build/bin/llama-server
          find build/bin -maxdepth 1 -type f -print

      - name: Package build
        run: |
          mkdir -p artifact/bin
          mkdir -p artifact/lib
          mkdir -p artifact/include

          cp -a build/bin/. artifact/bin/

          if [ -d build/lib ]; then
            cp -a build/lib/. artifact/lib/
          fi

          cp -a include/. artifact/include/

          if [ -d ggml/include ]; then
            mkdir -p artifact/ggml/include
            cp -a ggml/include/. artifact/ggml/include/
          fi

          cp LICENSE artifact/ 2>/dev/null || true
          cp README.md artifact/ 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-linux-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 14
